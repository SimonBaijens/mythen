<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mythen</title>
  <meta name="description" content="Een groeiende verzameling mythologische verhalen, elke dag een nieuw verhaal.">
  <meta name="theme-color" content="#171310">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mythen">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Myth<span>en</span></h1>
    <div class="tabs" role="tablist" aria-label="Weergave">
      <button id="tabVerhalen" class="actief" role="tab" aria-selected="true">Verhalen</button>
      <button id="tabFiguren" role="tab" aria-selected="false">Figuren</button>
      <button id="tabPantheon" role="tab" aria-selected="false">Pantheon</button>
    </div>
  </header>

  <nav class="chips" id="chips" aria-label="Mythologie"></nav>

  <main>
    <section id="verhalen" aria-label="Verhalen"></section>
    <section id="figuren" class="verborgen" aria-label="Goden en figuren"></section>
    <section id="pantheon" class="verborgen" aria-label="Pantheons per mythologie"></section>
  </main>

  <div class="sheet-achter verborgen" id="sheetAchter"></div>
  <aside class="sheet verborgen" id="sheet" role="dialog" aria-modal="true" aria-label="Figuur">
    <button class="sluit" id="sluit" aria-label="Sluiten">×</button>
    <div id="sheetInhoud"></div>
  </aside>

  <script src="app.js?v=3"></script>
</body>
</html>
